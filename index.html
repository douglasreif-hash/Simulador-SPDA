<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cenários de análise de risco — SPDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#EEF1F3; --surface:#FFFFFF; --sunk:#E3E8EC; --ink:#17202A; --muted:#566370;
  --rule:#C8D0D7; --accent:#2E43A3; --accent-soft:#DDE2F6; --pass:#1B7445; --pass-soft:#DCEFE3;
  --fail:#B0281F; --fail-soft:#F6DEDB; --warn:#9A5B00; --warn-soft:#F5E8D2; --info:#3D5568; --info-soft:#E1E8EE;
  --zone:#F7E3E0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161B; --surface:#1A2028; --sunk:#232B35; --ink:#E4E9EF; --muted:#9AA7B4;
    --rule:#33404D; --accent:#93A3FF; --accent-soft:#273055; --pass:#5FCB8E; --pass-soft:#173526;
    --fail:#FF8A80; --fail-soft:#40211F; --warn:#F0B35A; --warn-soft:#3A2C14; --info:#A9BCCB; --info-soft:#22303B;
    --zone:#3A2220; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161B; --surface:#1A2028; --sunk:#232B35; --ink:#E4E9EF; --muted:#9AA7B4;
  --rule:#33404D; --accent:#93A3FF; --accent-soft:#273055; --pass:#5FCB8E; --pass-soft:#173526;
  --fail:#FF8A80; --fail-soft:#40211F; --warn:#F0B35A; --warn-soft:#3A2C14; --info:#A9BCCB; --info-soft:#22303B;
  --zone:#3A2220; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;align-items:baseline;padding:1rem 1.5rem .75rem;border-bottom:1px solid var(--rule);background:var(--surface)}
.top h1{font-size:1.35rem}
.top .meta{color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100% - 60px)}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
aside{border-right:1px solid var(--rule);padding:1rem;background:var(--surface)}
@media (max-width:860px){aside{border-right:0;border-bottom:1px solid var(--rule)}}
aside h2{font-size:1rem;margin-bottom:.5rem}
.cenlist{list-style:none;margin:0 0 .75rem;padding:0;display:flex;flex-direction:column;gap:2px}
.cenlist button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:.45rem .6rem;cursor:pointer;border-radius:0 4px 4px 0}
.cenlist button:hover{background:var(--sunk)}
.cenlist button[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.cenlist .nm{display:block;font-weight:500}
.cenlist .sub{display:flex;gap:.5rem;font-size:.78rem;color:var(--muted)}
.dot{display:inline-flex;align-items:center;gap:3px}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fail)}
.dot.ok::before{background:var(--pass)}
.tag{display:inline-block;font-size:.72rem;padding:0 .4rem;border-radius:3px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.tag.builder{background:var(--info-soft);color:var(--info)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.btnrow{display:flex;flex-wrap:wrap;gap:.4rem}
.btn{border:1px solid var(--rule);background:var(--surface);padding:.35rem .7rem;border-radius:4px;cursor:pointer;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:.8rem;color:var(--muted)}
main{padding:1rem 1.5rem 3rem;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-bottom:.75rem}
.head h2{font-size:1.25rem}
.head input.nome{font-size:1.15rem;font-weight:600;border:1px solid transparent;background:transparent;padding:.1rem .3rem;border-radius:4px;min-width:12ch;width:min(100%,52ch)}
.head input.nome:hover,.head input.nome:focus{border-color:var(--rule);background:var(--surface)}
.banner{padding:.55rem .8rem;border-radius:4px;margin:.5rem 0 1rem;font-size:.9rem}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
/* régua de risco */
.reguas{display:grid;gap:.25rem;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.75rem 1rem .5rem;margin-bottom:1rem}
.regua{display:grid;grid-template-columns:7.5rem minmax(0,1fr);align-items:center;gap:.75rem}
.regua .lbl b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1.05rem}
.regua .lbl span{font-size:.8rem;color:var(--muted)}
.regua .val{font-size:.85rem}
.regua .val.ok{color:var(--pass)} .regua .val.no{color:var(--fail)}
.regua svg{width:100%;height:58px;display:block;overflow:visible}
.regua svg text{fill:var(--muted);font-size:10px}
.legend{font-size:.78rem;color:var(--muted);text-align:right}
/* abas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto;margin-bottom:1rem}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.5rem .8rem;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs .count{font-size:.75rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:0 .4rem;margin-left:.3rem}
section[role="tabpanel"][hidden]{display:none}
/* formulário */
fieldset{border:1px solid var(--rule);border-radius:6px;background:var(--surface);margin:0 0 1rem;padding:.25rem 1rem .75rem}
legend{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;padding:0 .35rem}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 5.5rem;gap:.5rem 1rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--sunk)}
.row:last-child{border-bottom:0}
@media (max-width:640px){.row{grid-template-columns:1fr 5rem}.row label{grid-column:1/-1}}
.row label{font-size:.9rem}
.row label small{display:block;color:var(--muted);font-size:.78rem}
.row .ctl{display:flex;gap:.4rem;min-width:0}
.row select,.row input[type=number],.row input[type=text]{width:100%;min-width:0;padding:.3rem .4rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.row input.cust{max-width:7rem}
.row select:disabled,.row input:disabled{opacity:.75}
.row .v{text-align:right;font-size:.85rem;color:var(--muted)}
.row.changed{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.row.flag label::after{content:"";color:var(--warn);font-size:.78rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:0 1rem}
/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface);margin-bottom:1rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.4rem .6rem;border-bottom:1px solid var(--sunk);text-align:left;vertical-align:top}
th{font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right;white-space:nowrap}
#tab-cmp td:first-child,#tab-cmp th:first-child{min-width:11rem}
#tab-cmp th.n{white-space:normal;min-width:8rem}
tr.diff td{background:var(--accent-soft)}
td.ok{color:var(--pass)} td.no{color:var(--fail)}
.cur{font-weight:600}
/* composição */
.comp{display:grid;grid-template-columns:3rem minmax(0,1fr) 6.5rem;gap:.35rem .75rem;align-items:center;font-size:.88rem;margin-bottom:1rem}
.comp .bar{height:14px;background:var(--sunk);border-radius:2px;overflow:hidden}
.comp .bar i{display:block;height:100%;background:var(--accent)}
.comp .bar i.dom{background:var(--fail)}
.comp .hint{grid-column:2/-1;margin-top:-.25rem;font-size:.78rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.75rem 1rem;margin-bottom:1rem}
.panel h3{font-size:1rem;margin-bottom:.5rem}
/* verificações */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.checks li{padding:.5rem .75rem;border-radius:4px;border-left:4px solid}
.checks .erro{background:var(--fail-soft);border-color:var(--fail)}
.checks .alerta{background:var(--warn-soft);border-color:var(--warn)}
.checks .info{background:var(--info-soft);border-color:var(--info)}
.checks b{font-weight:600;margin-right:.35rem}
/* memorial */
.memform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem 1rem;margin-bottom:.75rem}
.memform label{display:flex;flex-direction:column;font-size:.85rem;gap:.2rem}
.memform input,.memform select,.memform textarea{padding:.35rem .45rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.memform .wide{grid-column:1/-1}
.doc{background:#fff;color:#1a1a1a;max-width:820px;margin:1rem auto;padding:2.5rem 3rem;border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule);font-size:14px;line-height:1.55}
.doc h1{font-size:1.45rem;margin:0 0 .25rem;color:#1a1a1a}
.doc h2{font-size:1.1rem;margin:1.5rem 0 .5rem;color:#1a1a1a;border-bottom:1px solid #bbb;padding-bottom:.2rem}
.doc p{margin:.4rem 0;max-width:72ch}
.doc table{font-size:12.5px;margin:.4rem 0 .8rem}
.doc th,.doc td{border:1px solid #999;padding:.25rem .45rem}
.doc th{background:#e9e9e9;color:#1a1a1a}
.doc ul{margin:.3rem 0 .6rem 1.2rem;padding:0}
.doc .assin{margin-top:3rem;text-align:center}
.doc .assin div{border-top:1px solid #333;width:60%;margin:0 auto .3rem}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.5rem 1rem;border-radius:4px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{
  body{background:#fff}
  .top,aside,.head,.reguas,.tabs,.memform,.noprint,section[role="tabpanel"]:not(#tab-memorial){display:none!important}
  .layout{display:block} main{padding:0}
  #tab-memorial{display:block!important}
  .doc{border:0;box-shadow:none;margin:0;padding:0;max-width:none}
}
</style>
</head>

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("dados").textContent);
const PUB = !!D.publico; // versão pública: sem notas sobre limitações do software nem dados pessoais
const TAB = D.tabelas, OP = TAB.opcoes, CTX = D.contexto || {}, PROJ = CTX.projeto || {};
const RT1 = TAB.toleraveis.R1, RT3 = TAB.toleraveis.R3;
const LS_KEY = "spda-cenarios:" + (PROJ.nome || "projeto") + ":" + (D.gerado_em || "");
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- formatação ---------- */
const SUP = {"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function fmt(v, sig = 3) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a >= 0.01 && a < 1e5) return v.toLocaleString("pt-BR", {maximumSignificantDigits: Math.max(sig, 4)});
  const e = Math.floor(Math.log10(a)), m = v / 10 ** e;
  return m.toLocaleString("pt-BR", {maximumSignificantDigits: sig}) + " × 10" + String(e).split("").map(c => SUP[c]).join("");
}
const fmtPlain = (v) => v === 0 ? "0" : (Math.abs(v) >= 0.01 && Math.abs(v) < 1e5 ? v.toLocaleString("pt-BR",{maximumSignificantDigits:4}) : v.toExponential(2).replace(".", ",").replace("e", "E"));

/* ---------- opções ---------- */
const GR = { // parâmetro -> grupo de opções
  cd:"cd", pb:"pb", pta:"pta", ptu:"ptu", rt:"rt", rf:"rf", rp:"rp", hz:"hz", rs:"rs", lf:"lf", ft:"ft"
};
const GRL = { pspd:"dps", ci:"ci", ct:"ct", ce:"ce", linha:"linha_cld", pld:"pld", ks3:"ks3", uw:"uw", cdj:"cd" };
const opt = (g, id) => OP[g].find(o => o.id === id);
function valorOp(g, sel, np) {
  if (typeof sel === "string" && sel.startsWith("custom:")) return parseFloat(sel.slice(7));
  const o = opt(g, sel);
  if (!o) return NaN;
  if (o.por_np) return TAB.np[np][o.por_np];
  return o.valor;
}
function selDeValor(g, v, np) {
  for (const o of OP[g]) {
    if (o.por_np) { if (np && Math.abs(TAB.np[np][o.por_np] - v) < 1e-12) return o.id; continue; }
    if (o.valor !== undefined && Math.abs(o.valor - v) < 1e-12) return o.id;
  }
  return "custom:" + v;
}
function selLinhaDe(cld, cli) {
  const o = OP.linha_cld.find(o => o.cld === cld && o.cli === cli);
  return o ? o.id : "custom:" + cld + "|" + cli;
}

/* ---------- cenário: estado <-> parâmetros numéricos ---------- */
function deParams(c) {               // cenário lido do memorial (numérico) -> estado editável
  const p = c.params, np = c.np || "IV";
  const s = {np, explosao:"nao", sel:{}, num:{}, linhas:{}, dps:{}};
  for (const k in GR) s.sel[k] = selDeValor(GR[k], p[k], np);
  // P_B por NP só quando o valor coincide com a classe; senão a opção fixa
  if (s.sel.pb === "spda" && OP.pb.some(o => o.valor === p.pb)) s.sel.pb = OP.pb.find(o => o.valor === p.pb).id;
  for (const k of ["ng","ad","am","nz","nt","tz","lt","lf3","cz","ct_valor"]) s.num[k] = p[k];
  s.dps.entrada = p.peb >= 1 ? "sem" : "com";
  s.dps.np = p.peb >= 1 ? "acoplado" : (Math.abs(p.peb - TAB.np[np].peb) < 1e-12 ? "acoplado" : selDeValor("dps", p.peb));
  for (const L of ["E","T"]) {
    const l = p.linhas[L], sl = {existe: l.existe !== false, sel:{}, num:{}};
    for (const k of ["pspd","ci","ct","ce","pld","ks3","uw","cdj"]) sl.sel[k] = selDeValor(GRL[k], l[k]);
    sl.sel.linha = selLinhaDe(l.cld, l.cli);
    for (const k of ["ll","ks1","ks2","adj"]) sl.num[k] = l[k];
    const pliAuto = TAB.pli_por_uw[L][String(l.uw)];
    sl.pli = (pliAuto !== undefined && Math.abs(pliAuto - l.pli) < 1e-12) ? "auto" : "custom:" + l.pli;
    s.linhas[L] = sl;
  }
  return s;
}
function paraParams(s) {             // estado editável -> parâmetros numéricos do motor
  const np = s.np, p = {};
  for (const k in GR) p[k] = valorOp(GR[k], s.sel[k], np);
  Object.assign(p, s.num);
  if (s.dps.entrada === "sem") p.peb = 1;
  else p.peb = s.dps.np === "acoplado" ? TAB.np[np].peb : valorOp("dps", s.dps.np);
  p.linhas = {};
  for (const L of ["E","T"]) {
    const sl = s.linhas[L], l = {existe: sl.existe};
    for (const k of ["pspd","ci","ct","ce","pld","ks3","uw","cdj"]) l[k] = valorOp(GRL[k], sl.sel[k]);
    if (sl.sel.linha.startsWith("custom:")) { const [a,b] = sl.sel.linha.slice(7).split("|").map(Number); l.cld = a; l.cli = b; }
    else { const o = opt("linha_cld", sl.sel.linha); l.cld = o.cld; l.cli = o.cli; }
    Object.assign(l, sl.num);
    l.pli = sl.pli === "auto" ? (TAB.pli_por_uw[L][String(l.uw)] ?? 1) : parseFloat(sl.pli.slice(7));
    p.linhas[L] = l;
  }
  return p;
}

/* ---------- motor (espelho de scripts/risco.py) ---------- */
function calcular(p) {
  const ng = p.ng, Nd = ng * p.ad * p.cd * 1e-6, Nm = ng * p.am * 1e-6;
  const ocup = (p.nz / p.nt) * (p.tz / 8760);
  const La = p.rt * p.lt * ocup * p.rs;
  const Lb = p.rp * p.rf * p.hz * p.lf * ocup * p.rs;
  const Lb3 = p.rp * p.rf * p.lf3 * (p.ct_valor ? p.cz / p.ct_valor : 0);
  const Pb = p.pb, Peb = p.peb, Pa = p.pta * Pb;
  const at = [];
  for (const L of ["E","T"]) {
    const l = p.linhas[L]; if (!l.existe) continue;
    const Nl = ng * 40 * l.ll * l.ci * l.ce * l.ct * 1e-6;
    const Ni = ng * 4000 * l.ll * l.ci * l.ce * l.ct * 1e-6;
    const Ndj = ng * (l.adj || 0) * l.cdj * l.ct * 1e-6;
    const ks4 = Math.min(1, 1 / l.uw), pms = (l.ks1 * l.ks2 * l.ks3 * ks4) ** 2;
    at.push({L, Nl, Ni, Ndj, pms, pu: p.ptu * Peb * l.pld * l.cld, pv: Peb * l.pld * l.cld,
      pc: l.pspd * l.cld, pm: l.pspd * pms, pw: l.pspd * l.pld * l.cld, pz: l.pspd * l.pli * l.cli});
  }
  const comb = k => at.length ? 1 - at.reduce((a, v) => a * (1 - v[k]), 1) : 0;
  const sum = f => at.reduce((a, v) => a + f(v), 0);
  const c = {};
  c.Ra = Nd * Pa * La; c.Rb = Nd * Pb * Lb;
  c.Ru = sum(v => (v.Nl + v.Ndj) * v.pu * La); c.Rv = sum(v => (v.Nl + v.Ndj) * v.pv * Lb);
  c.Rb3 = Nd * Pb * Lb3; c.Rv3 = sum(v => (v.Nl + v.Ndj) * v.pv * Lb3);
  c.Fb = Nd * Pb; c.Fc = Nd * comb("pc"); c.Fm = Nm * comb("pm");
  c.Fv = sum(v => (v.Nl + v.Ndj) * Peb); c.Fw = sum(v => (v.Nl + v.Ndj) * v.pw); c.Fz = sum(v => v.Ni * v.pz);
  const R1 = c.Ra + c.Rb + c.Ru + c.Rv, R3 = c.Rb3 + c.Rv3;
  const F = c.Fb + c.Fc + c.Fm + c.Fv + c.Fw + c.Fz;
  return {Nd, Nm, La, Lb, c, R1, R3, F, Ft: p.ft, ok1: R1 <= RT1, ok3: R3 <= RT3, okF: F <= p.ft, linhas: at};
}
// R3 só se aplica com patrimônio cultural (c_z > 0); sem ele é sempre 0 e só polui a tela
const usaR3 = () => cenarios.some(c => paraParams(c.s).cz > 0);

/* ---------- estado global ---------- */
let cenarios = [];   // {id, nome, origem, arquivo, data, base, s, builder}
let atual = 0;
const memo = {resp: PROJ.autor || "", crea: PROJ.crea || "", art: "", adotado: null, incluir: null, obs: "", local: [PROJ.municipio, PROJ.uf].filter(Boolean).join(" / ")};
let uid = 1;
function novoId() { return "c" + (uid++) + "-" + Date.now().toString(36); }

function carregarIniciais() {
  cenarios = (D.cenarios || []).map(c => ({id: novoId(), nome: c.nome, origem: c.origem || "builder", arquivo: c.arquivo, data: c.data,
    hora: c.hora, autor: c.autor, dim: c.dimensoes, nota: c.nota, baseNome: c.base, s: deParams(c), builder: c.origem === "simulado" ? undefined : c.builder}));
  for (const c of cenarios) if (c.baseNome) c.base = (cenarios.find(x => x.nome === c.baseNome) || {}).id;
  if (D.adotado) memo.adotado = (cenarios.find(x => x.nome === D.adotado) || {}).id || null;
}
function salvarLocal() {
  try {
    const sim = cenarios.filter(c => c.origem !== "builder");
    localStorage.setItem(LS_KEY, JSON.stringify({sim, memo}));
  } catch (e) { /* armazenamento indisponível: segue em memória */ }
}
function lerLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    (o.sim || []).forEach(c => cenarios.push(c));
    Object.assign(memo, o.memo || {});
  } catch (e) { /* ignora */ }
}

/* ---------- verificações (espelho de comparar_cenarios.py) ---------- */
function classeDps(peca) {
  if (peca === null || peca === undefined) return ["n/d", "sem campo de DPS no Builder (conferir ficha/projeto)"];

function regua(id, rotulo, desc, valores, tol, idxAtual, tolTxt) {
  const nz = valores.filter(v => v > 0);
  let lo = Math.floor(Math.log10(Math.min(tol, ...(nz.length ? nz : [tol])))) - 1;
  let hi = Math.ceil(Math.log10(Math.max(tol, ...(nz.length ? nz : [tol])))) + 1;
  if (hi - lo < 5) { const pad = 5 - (hi - lo); lo -= Math.ceil(pad / 2); hi += Math.floor(pad / 2); }
  const W = 1000, X = v => v <= 0 ? 0 : ((Math.log10(v) - lo) / (hi - lo)) * W;
  let g = `<rect x="${X(tol)}" y="14" width="${W - X(tol)}" height="22" fill="var(--zone)"/>`;
  g += `<line x1="0" x2="${W}" y1="25" y2="25" stroke="var(--rule)" stroke-width="2"/>`;
  for (let e = lo; e <= hi; e++) {
    const x = X(10 ** e);
    g += `<line x1="${x}" x2="${x}" y1="20" y2="30" stroke="var(--rule)"/>`;
    g += `<text x="${x}" y="52" text-anchor="middle">10${String(e).split("").map(c => SUP[c]).join("")}</text>`;
  }
  g += `<line x1="${X(tol)}" x2="${X(tol)}" y1="8" y2="40" stroke="var(--fail)" stroke-width="2"/>`;
  g += `<text x="${X(tol) + 4}" y="10" style="fill:var(--fail)">tolerável ${tolTxt}</text>`;
  valores.forEach((v, i) => {
    if (i === idxAtual) return;
    g += `<circle cx="${X(v)}" cy="25" r="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"><title>${esc(cenarios[i].nome)}: ${fmt(v)}</title></circle>`;
  });
  const va = valores[idxAtual];
  g += `<circle cx="${X(va)}" cy="25" r="8" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${esc(cenarios[idxAtual].nome)}: ${fmt(va)}</title></circle>`;
  const ok = va <= tol;
  return `<div class="regua" id="${id}"><div class="lbl"><b>${rotulo}</b><span>${desc}</span>
    <div class="val ${ok ? "ok" : "no"}">${fmt(va)} ${ok ? "atende" : "não atende"}</div></div>
    <svg viewBox="0 0 ${W} 58" preserveAspectRatio="none" role="img" aria-label="${rotulo} = ${fmt(va)}; tolerável ${tolTxt}">${g}</svg></div>`;
}

function onParamChange(e) {
  const c = cenarios[atual]; if (c.origem === "builder") return;
  const t = e.target, s = c.s;
  const num = v => parseFloat(String(v).replace(",", "."));
  if (t.dataset.np !== undefined) s.np = t.value;
  else if (t.dataset.ex !== undefined) s.explosao = t.value;
  else if (t.dataset.dps) s.dps[t.dataset.dps] = t.value;
  else if (t.dataset.k2 === "existe") s.linhas[t.dataset.l].existe = t.value === "1";
  else if (t.dataset.k2 === "pli") s.linhas[t.dataset.l].pli = t.value === "auto" ? "auto" : "custom:" + paraParams(s).linhas[t.dataset.l].pli;
  else if (t.dataset.plic) { const v = num(t.value); if (!isNaN(v)) s.linhas[t.dataset.plic].pli = "custom:" + v; }
  else if (t.dataset.k || t.dataset.kc) {
    const key = t.dataset.k || t.dataset.kc, [a, b] = key.split(".");
    const tgt = b ? s.linhas[a].sel : s.sel, k = b || a;
    if (t.dataset.kc) { const v = k === "linha" ? t.value.replace(/\s/g, "").replace("/", "|") : num(t.value); if (k === "linha" || !isNaN(v)) tgt[k] = "custom:" + v; }
    else if (t.value === "__custom") {
      const atualV = b ? paraParams(s).linhas[a][k === "linha" ? "cld" : k] : paraParams(s)[k];
      tgt[k] = k === "linha" ? "custom:" + paraParams(s).linhas[a].cld + "|" + paraParams(s).linhas[a].cli : "custom:" + atualV;
    } else tgt[k] = t.value;
  } else if (t.dataset.n) {
    const [a, b] = t.dataset.n.split("."), v = num(t.value);
    if (isNaN(v)) return;
    if (b) s.linhas[a].num[b] = v; else s.num[a] = v;
  } else return;
  const foco = t.dataset.n || t.dataset.kc || t.dataset.plic ? (t.dataset.n || t.dataset.kc || t.dataset.plic) : null;
  salvarLocal();
  renderTudo(foco ? {foco} : {});
}

function blocoComp(titulo, r, keys, tot) {
  const max = Math.max(...keys.map(k => r.c[k]), 0);
  let h = `<div class="panel"><h3>${titulo} = ${fmt(tot)}</h3><div class="comp">`;
  for (const k of keys) {

    h += `<b>${k.replace(/(\d)$/, "")}</b><div class="bar" title="${pct.toFixed(1)} %"><i class="${v === max && v > 0 ? "dom" : ""}" style="width:${pct}%"></i></div><span class="n">${fmt(v)} · ${pct.toFixed(pct < 1 && pct > 0 ? 1 : 0)} %</span><div class="hint">${DICA[k.replace(/3$/, "")]}</div>`;

}

    regua("rg1", "R1", "perda de vida humana", rs.map(x => x.R1), RT1, atual, fmt(RT1)) +
    (usaR3() ? regua("rg3", "R3", "patrimônio cultural", rs.map(x => x.R3), RT3, atual, fmt(RT3)) : "") +
    regua("rgF", "F", "frequência de danos", rs.map(x => x.F), r.Ft, atual, fmt(r.Ft)) +
    `<div class="legend">● cenário atual · ○ demais cenários · faixa vermelha: acima do tolerável (escala logarítmica)</div>`;
}
let abaAtual = "t-param";
function renderAba() {
  ({"t-param": renderParam, "t-comp": renderComp, "t-cmp": renderCmp, "t-ver": () => {}, "t-ele": renderEle, "t-mem": () => { renderMemForm(); renderDoc(); }})[abaAtual]();
}
function renderTudo(o = {}) {
  renderLista(); renderHead(); renderReguas(); renderVer(); renderAba();
  if (o.foco) { const el = document.querySelector(`[data-n="${o.foco}"],[data-kc="${o.foco}"],[data-plic="${o.foco}"]`); if (el) { el.focus(); try { const L = el.value.length; el.setSelectionRange && el.type === "text" && el.setSelectionRange(L, L); } catch (e) {} } }
}

/* ---------- eventos ---------- */
$("#cenlist").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (!b) return; atual = +b.dataset.i; renderTudo(); });
$("#b-dup").addEventListener("click", () => {
  const c = cenarios[atual], n = JSON.parse(JSON.stringify(c));
  n.id = novoId(); n.origem = "simulado"; n.base = c.id; n.nome = c.nome + " — cópia"; delete n.builder;
  cenarios.splice(atual + 1, 0, n); atual++; salvarLocal(); renderTudo(); $("#nome").select();
});
$("#b-del").addEventListener("click", () => {
  const c = cenarios[atual]; if (c.origem === "builder") return;
  cenarios.splice(atual, 1); atual = Math.max(0, atual - 1); salvarLocal(); renderTudo(); toast(`Cenário "${c.nome}" excluído`);
});
$("#nome").addEventListener("change", e => { const c = cenarios[atual]; if (c.origem === "builder") return; c.nome = e.target.value.trim() || c.nome; salvarLocal(); renderLista(); });
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[role=tab]"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section[role=tabpanel]").forEach(s => s.hidden = s.id !== b.getAttribute("aria-controls"));
  abaAtual = b.id; renderAba();
});
$("#tab-param").addEventListener("change", onParamChange);
$("#tab-cmp").addEventListener("change", e => { if (e.target.id === "cmp-todos") { cmpTodos = e.target.checked; renderCmp(); } });
$("#memform").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.m) memo[t.dataset.m] = t.value;
  else if (t.dataset.inc) { const set = new Set(memo.incluir || cenarios.map(c => c.id)); t.checked ? set.add(t.dataset.inc) : set.delete(t.dataset.inc); memo.incluir = cenarios.map(c => c.id).filter(id => set.has(id)); }
  salvarLocal(); renderDoc();
});
$("#b-print").addEventListener("click", () => { try { window.print(); } catch (e) { toast("Impressão indisponível aqui: baixe o .docx ou o HTML"); } });
$("#b-docx").addEventListener("click", baixarDocx);
$("#b-html").addEventListener("click", baixarHtml);
$("#b-exp").addEventListener("click", exportarJson);
$("#f-imp").addEventListener("change", e => { if (e.target.files[0]) importarJson(e.target.files[0]); e.target.value = ""; });

/* ---------- início ---------- */
if (PUB) { const d = $("#demo"); d.hidden = false; d.textContent = "Projeto de demonstração. Os cenários marcados como Builder vêm dos memoriais de cálculo do AltoQi Builder (NBR 5419-2:2026); use Duplicar para testar suas próprias variações, calculadas aqui no navegador."; }
$("#tit").textContent = "Cenários de análise de risco — " + (PROJ.empreendimento || PROJ.nome || "SPDA");
$("#meta").textContent = [PROJ.nome, [PROJ.municipio, PROJ.uf].filter(Boolean).join("/"), PROJ.categoria, "NBR 5419-2:2026"].filter(Boolean).join(", ");
carregarIniciais(); lerLocal();
if (!cenarios.length) { document.querySelector("main").innerHTML = "<p>Nenhum cenário carregado. Gere o simulador a partir de um memorial de cálculo do Builder.</p>"; return; }
renderTudo();
window.__spda = {calcular, paraParams, deParams, cenarios: () => cenarios};
})();
</script>
</body>
</html>
